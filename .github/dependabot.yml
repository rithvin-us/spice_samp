version: 2

updates:
  # Application and tooling dependencies. Grouped so a routine bump lands as a
  # few reviewable PRs rather than a dozen — the React and Three.js stacks in
  # particular want to move together to stay version-compatible.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react'
          - '@types/react-dom'
      three:
        patterns:
          - three
          - '@types/three'
          - '@react-three/*'
      dev-dependencies:
        dependency-type: development

  # Keep the pinned GitHub Actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    commit-message:
      prefix: chore(ci)
